name: Feature request
description: Suggest a new feature or enhancement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Great. For open-ended discussion, consider starting
        a thread in [Discussions](../../discussions) first — issues are
        best for concrete, actionable proposals.

        External code contributions start here as text. Describe and discuss
        the change before writing code, then wait for a maintainer to accept
        one bounded scope. Please do not open an implementation pull request
        until that happens.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Sketch the API / UX / config.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you've tried or thought about.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and source material
      description: Link real hardware or protocol documents, tariff rules, screenshots, logs, user reports, or other evidence that defines the need.
      placeholder: State what the source proves, its version or effective date, and any limits.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries, failure behavior and proof
      description: What stays out of scope? How should failure stay safe? What test, run, HIL result, or rendered view would prove the change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Driver (new hardware support)
        - Control / dispatch
        - Battery model / self-tune
        - MPC / planner
        - PV / load / price twins
        - HTTP API
        - Web UI
        - Home Assistant integration
        - Nova federation
        - Self-update / deploy
        - Docs
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Hardware datasheets, protocol docs, screenshots, links.
  - type: checkboxes
    id: text-first
    attributes:
      label: Contribution path
      options:
        - label: I will wait for a maintainer to accept the written scope before opening an implementation pull request.
          required: true
