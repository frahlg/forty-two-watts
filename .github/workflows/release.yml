name: release

# Changesets-driven release. Pattern lifted from umara/u-front.
#
# This workflow ONLY handles the changesets flow + tag + GitHub Release
# creation. The cross-platform binaries, docker images, and
# Discord announcement live in `release-assets.yml` and are triggered
# explicitly via `gh workflow run release-assets.yml --ref vX.Y.Z` at
# the end of the publish step. Keeping the heavy build matrix out of
# this workflow means regular changeset-PR merges to master don't
# queue + skip ~half a dozen asset jobs on every single push.
#
# Flow:
#   1. PRs land on master, each carrying a `.changeset/*.md` file (or
#      touching only allowlisted paths — see changeset-check.yml).
#   2. This workflow fires on push to master.
#      - `changesets/action` opens / updates a "Version Packages" PR
#        whenever unconsumed changesets exist. We deliberately do NOT
#        pass `publish:` — past experience on admin-next showed
#        `changeset publish` / `changeset tag` silently no-op'd in
#        CI, and the action's built-in `createGithubReleases` defaults
#        to true and 422-collides with our own `gh release create`.
#      - After the Version PR merges, dispatch beta.yml from that exact commit
#        and validate it on real sites.
#      - Manually dispatch this workflow with the exact tested beta tag.
#        Promotion refuses a beta that does not point to this commit.
#
# Stable publication is deliberately workflow_dispatch-only. A merge creates
# the version candidate; an operator chooses when its beta is ready to promote.

on:
  push:
    branches: [master]
    # Every releasable PR adds a changeset. The generated Version Packages PR
    # then changes package/lock/changelog while consuming those files. Those
    # are the only master pushes that need the Changesets orchestration job.
    paths:
      - '.changeset/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'scripts/apply-codename.cjs'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      source_beta:
        description: "Exact beta tag validated on real sites"
        required: true
        type: string

# changesets/action needs to push the Version PR. The publish step
# pushes the tag + creates the GH release + dispatches release-assets.
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write   # required by `gh workflow run release-assets.yml` at the end

# Serialize release workflow runs. Two concurrent "push to master"
# events otherwise race on the Version PR branch + tag creation.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: changesets (version PR / publish)
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version:   ${{ steps.publish.outputs.version }}
      beta_tag:  ${{ steps.publish.outputs.beta_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # changesets/action needs full history so it can detect
          # which changesets have already been consumed by past
          # Version PRs (it walks .changeset/ vs CHANGELOG.md).
          fetch-depth: 0
          # Checkout may use github.token for its own fetch, but must not leave
          # an includeIf credential behind. Each later git phase installs one
          # explicit header below.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use CI token for Version Packages branch
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CI_TOKEN}" ]; then
            echo "CI_TOKEN is required to update the Version Packages branch." >&2
            exit 1
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${CI_TOKEN}" | base64 | tr -d '\n')"
          AUTH_HEADER_COUNT="$(git config --get-all http.https://github.com/.extraheader | wc -l | tr -d '[:space:]')"
          if [ "${AUTH_HEADER_COUNT}" != "1" ]; then
            echo "Expected one GitHub auth header for the Version Packages push; found ${AUTH_HEADER_COUNT}." >&2
            exit 1
          fi

      - name: Create or update Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          # `version-packages` runs `changeset version` to bump package.json
          # and rewrite CHANGELOG.md, then synchronizes package-lock.json's
          # root package metadata with the generated version.
          # We deliberately do NOT pass `publish:` — see the header
          # comment for the rationale. The publish step below does
          # the tag + GitHub Release manually, idempotently.
          version: npm run version-packages
          title:  "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          # changesets/action uses this token for its GitHub API calls. Its
          # git push uses the single local auth header installed by the prior
          # step; checkout does not persist a second credential.
          #
          # CI_TOKEN should be a fine-grained PAT scoped to THIS repo with
          # `contents: write` + `pull-requests: write` only — nothing here
          # needs broader scope, and a narrow token bounds the blast radius.
          GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}

      - name: Restore default release credential
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          AUTH_HEADER_COUNT="$(git config --get-all http.https://github.com/.extraheader | wc -l | tr -d '[:space:]')"
          if [ "${AUTH_HEADER_COUNT}" != "1" ]; then
            echo "Expected one GitHub auth header after restoring the release credential; found ${AUTH_HEADER_COUNT}." >&2
            exit 1
          fi

      - name: Set up Docker Buildx for stable promotion validation
        if: github.event_name == 'workflow_dispatch' && steps.changesets.outputs.hasChangesets == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Tag and create GitHub Release
        id: publish
        # Stable is an explicit promotion after real beta validation. Pushes
        # still maintain the Version Packages PR but never publish stable.
        if: github.event_name == 'workflow_dispatch' && steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BETA: ${{ inputs.source_beta }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            TAG_EXISTS=true
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            STABLE_COMMIT="$(git rev-list -n 1 "${TAG}")"
            if [ "${STABLE_COMMIT}" != "${GITHUB_SHA}" ]; then
              echo "Existing stable tag ${TAG} points to ${STABLE_COMMIT}, not candidate ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi
          RELEASE_EXISTS=false
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          # Already-done case: a previous run completed cleanly. No
          # new release was cut on THIS run, so the release-assets
          # dispatch below should skip — emit `published=false`.
          if [ "${TAG_EXISTS}" = "true" ] && [ "${RELEASE_EXISTS}" = "true" ]; then
            echo "Tag ${TAG} and GitHub Release already exist — nothing to publish."
            {
              echo "published=false"
              echo "version=${VERSION}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Stable is a promotion, never the first public channel for a commit.
          # beta.yml also checks that the prerelease base matches package.json.
          git fetch --force --tags origin
          BETA_TAG="${INPUT_BETA}"
          if [[ ! "${BETA_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || \
             [ "${BETA_TAG%-beta.*}" != "${TAG}" ]; then
            echo "source_beta must name the exact tested ${TAG}-beta.N candidate." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${BETA_TAG}"; then
            echo "Selected beta tag ${BETA_TAG} does not exist." >&2
            exit 1
          fi
          BETA_COMMIT="$(git rev-list -n 1 "${BETA_TAG}")"
          if [ "${BETA_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "${BETA_TAG} points to ${BETA_COMMIT}, but stable candidate is ${GITHUB_SHA}." >&2
            echo "Publish a beta from this exact commit before promotion." >&2
            exit 1
          fi

          BETA_RELEASE_JSON="$(gh release view "${BETA_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease,publishedAt 2>/dev/null || true)"
          if ! jq -e --arg tag "${BETA_TAG}" '
            .tagName == $tag
            and .isDraft == false
            and .isPrerelease == true
            and (.publishedAt | type == "string" and length > 0)
          ' <<<"${BETA_RELEASE_JSON}" >/dev/null; then
            echo "${BETA_TAG} is not a completed GitHub prerelease." >&2
            exit 1
          fi

          DIGEST_DIR="${RUNNER_TEMP}/beta-digests"
          mkdir -p "${DIGEST_DIR}"
          gh release download "${BETA_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern ftw-image-digests.json \
            --dir "${DIGEST_DIR}"
          DIGEST_RECORD="${DIGEST_DIR}/ftw-image-digests.json"
          jq -e \
            --arg tag "${BETA_TAG}" \
            --arg commit "${GITHUB_SHA}" \
            --arg version "${VERSION}" '
              .schema == 1
              and .tag == $tag
              and .commit == $commit
              and .stable_version == $version
              and (.images.core.digest | test("^sha256:[0-9a-f]{64}$"))
              and (.images.updater.digest | test("^sha256:[0-9a-f]{64}$"))
            ' "${DIGEST_RECORD}" >/dev/null
          CORE_DIGEST="$(jq -r '.images.core.digest' "${DIGEST_RECORD}")"
          UPDATER_DIGEST="$(jq -r '.images.updater.digest' "${DIGEST_RECORD}")"

          verify_beta_image() {
            local image_ref="$1"
            local expected_digest="$2"
            local metadata
            local current_digest
            metadata="${RUNNER_TEMP}/$(echo "${image_ref}" | tr '/:' '--').json"
            current_digest="$(scripts/inspect-image-digest.sh "${image_ref}")"
            if [ "${current_digest}" != "${expected_digest}" ]; then
              echo "Published beta tag ${image_ref} moved: recorded ${expected_digest}, current ${current_digest}." >&2
              exit 1
            fi
            if ! docker buildx imagetools inspect "${image_ref}@${expected_digest}" \
              --format '{{json .Image}}' > "${metadata}"; then
              echo "Published beta image ${image_ref} is unavailable." >&2
              exit 1
            fi
            python3 - "${metadata}" "${GITHUB_SHA}" "${VERSION}" "${image_ref}" <<'PY'
          import json
          import sys

          path, expected_revision, expected_version, image_ref = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              images = json.load(source)

          required_platforms = ("linux/amd64", "linux/arm64")
          for platform in required_platforms:
              image = images.get(platform)
              if image is None:
                  raise SystemExit(f"{image_ref} is missing required platform {platform}")
              labels = image.get("config", {}).get("Labels", {})
              revision = labels.get("org.opencontainers.image.revision")
              version = labels.get("org.opencontainers.image.version")
              if revision != expected_revision or version != expected_version:
                  raise SystemExit(
                      f"{image_ref} metadata mismatch for {platform}: "
                      f"revision={revision!r} version={version!r}"
                  )
          PY
          }

          verify_beta_image "ghcr.io/srcfl/ftw:${BETA_TAG}" "${CORE_DIGEST}"
          verify_beta_image "ghcr.io/srcfl/ftw-updater:${BETA_TAG}" "${UPDATER_DIGEST}"
          echo "Promoting tested ${BETA_TAG} to ${TAG}."

          # Build codename-annotated release notes. The script extracts
          # the latest section from CHANGELOG.md (between `## <version>`
          # and the next version-shaped heading) and prepends the
          # Hitchhiker codename header.
          node scripts/apply-codename.cjs "${VERSION}" > release-notes.md
          STATE_SCHEMA="$(node -p "require('./state-schema.json').version")"
          if [[ ! "${STATE_SCHEMA}" =~ ^[1-9][0-9]*$ ]]; then
            echo "state-schema.json must contain a positive integer version" >&2
            exit 1
          fi
          printf '\n\n<!-- ftw-state-schema:%s -->\n' "${STATE_SCHEMA}" >> release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

          if [ "${TAG_EXISTS}" = "false" ]; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            # Push with the restored GITHUB_TOKEN credential. The explicit
            # dispatch below binds the chosen beta before assets can publish.
            # Checkout does not persist its own credential; see the Checkout step.
            git push origin "${TAG}"
          fi

          if [ "${RELEASE_EXISTS}" = "false" ]; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

          {
            echo "published=true"
            echo "version=${VERSION}"
            echo "beta_tag=${BETA_TAG}"
          } >> "${GITHUB_OUTPUT}"
          echo "Published ${TAG}"

      - name: Dispatch release-assets workflow
        # release-assets.yml only accepts explicit dispatches, which carry the
        # exact validated beta selected above.
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.publish.outputs.version }}
          BETA_TAG: ${{ steps.publish.outputs.beta_tag }}
        run: |
          set -euo pipefail
          echo "Dispatching release-assets.yml for ${TAG}"
          gh workflow run release-assets.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TAG}" \
            -f source_beta="${BETA_TAG}"
